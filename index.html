<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TECNO PC MDZ · Servicio Técnico</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap">
<style>
:root{color-scheme:dark;--bg:#080304;--card:rgba(255,255,255,.055);--tx:#fff;--mute:#c4aeb1;--line:rgba(255,255,255,.13);--acc:#d71c1c;--acc2:#ff4b45;--blue:#5b7cff;--ok:#2fb86a;--warn:#f2a93b;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--tx);font:15px/1.5 Poppins,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(900px 500px at 90% 0,rgba(215,28,28,.35),transparent 70%),radial-gradient(800px 500px at 0 100%,rgba(122,10,10,.55),transparent 70%),var(--bg);background-attachment:fixed}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 48px}.c{max-width:760px;margin:0 auto}
h1,h2,h3{margin:0}h2{font-size:17px;font-weight:600}
a{color:inherit}
.hero{text-align:center;padding:18px 0 22px}.hero img{width:132px;height:132px;border-radius:50%;box-shadow:0 8px 40px rgba(215,28,28,.45)}
.hero h1{font-size:30px;font-weight:700;margin-top:12px;letter-spacing:.5px}.hero p{margin:4px 0 0;color:var(--mute)}
.cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.cta a{display:inline-flex;align-items:center;gap:8px;padding:10px 22px;border-radius:99px;text-decoration:none;font-weight:600;font-size:14px;border:1px solid transparent;color:#fff}
.ig{background:var(--acc)}.wa{border-color:rgba(255,255,255,.5)}.cta a:hover{filter:brightness(1.15)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;backdrop-filter:blur(6px)}
label{display:block;font-size:12px;color:var(--mute);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.5px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.4);color:var(--tx);font:inherit}
textarea{min-height:70px;resize:vertical}
.btn{padding:10px 18px;border:0;border-radius:10px;background:var(--acc);color:var(--on);font:inherit;font-weight:600;cursor:pointer}
.btn.g{background:transparent;border:1px solid var(--line)}.btn.s{padding:7px 14px;font-size:13px}.btn:hover{filter:brightness(1.15)}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--acc);font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok)}.pill.x{background:#555}.pill.w{background:var(--warn);color:#201300}
.meta{color:var(--mute);font-size:13px}.msg{padding:10px 12px;border-radius:10px;background:rgba(0,0,0,.35);border:1px solid var(--line);margin-top:10px;font-size:14px}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}
.bar{height:8px;background:var(--line);border-radius:99px;margin:12px 0 4px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.foot{text-align:center;color:var(--mute);font-size:12px;margin-top:28px;border-top:1px solid var(--line);padding-top:14px}
/* panel */
.bar2{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}.bar2 img{width:46px;height:46px;border-radius:50%}
.bar2 h1{font-size:19px;font-weight:700}.bar2 .sp{flex:1}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
@media(max-width:820px){.kpis{grid-template-columns:1fr 1fr}}
.k{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;border-top:3px solid var(--acc)}
.k.b{border-top-color:var(--blue)}.k.o{border-top-color:var(--ok)}.k.w{border-top-color:var(--warn)}
.k span{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.5px}.k b{display:block;font-size:24px;font-weight:700}
.flt{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin-bottom:12px}@media(max-width:640px){.flt{grid-template-columns:1fr}}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:980px;font-size:13.5px}
th{position:sticky;top:0;text-align:left;padding:10px 12px;background:rgba(215,28,28,.25);font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;white-space:nowrap}
td{padding:9px 12px;border-top:1px solid var(--line);white-space:nowrap}tr.r:hover td{background:rgba(255,255,255,.05);cursor:pointer}
td.n,th.n{text-align:right}td select{padding:4px 8px;font-size:12.5px;width:auto}.neg{color:var(--acc2)}.pos{color:var(--ok)}
tfoot td{font-weight:700;background:rgba(0,0,0,.35)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:max(16px,env(safe-area-inset-top,0px)) 12px 24px;z-index:20}
.md{background:#170a0c;border:1px solid var(--line);border-radius:18px;padding:20px;width:100%;max-width:640px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}@media(max-width:560px){.g2{grid-template-columns:1fr}}
[hidden]{display:none!important}
</style>
</head>

const C={nombre:'TECNO PC MDZ',ig:'tecnopc.mdz',wa:''};
const ESTADOS=['Ingresado','En diagnóstico','Esperando aprobación','En reparación','Listo para retirar','Entregado','Cancelado'];
const PAGOS=['Efectivo','Transferencia','Mercado Pago','Otro'];
const PUB=JSON.parse($('#pub').textContent||'[]');
const money=v=>'$ '+Math.round(Number(v)||0).toLocaleString('es-AR');
const fecha=t=>t?new Date(t).toLocaleDateString('es-AR'):'';
const num=v=>Number(v)||0;
const pg=e=>e==='Cancelado'?0:Math.round(ESTADOS.indexOf(e)/5*100);
const cls=e=>e==='Listo para retirar'||e==='Entregado'?'ok':e==='Cancelado'?'x':e==='Esperando aprobación'?'w':'';
async function hash(t){const d=String(t).replace(/\D/g,'').slice(-10);if(d.length<8)return null;
 const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('taller:'+d));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
let db=null,admin=false,items=[],editing=null,delArm=false,F={q:'',e:'',c:''},S={k:'ingreso',d:-1};

const IG='<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>';
const WA='<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 21l1.6-4.8A8.5 8.5 0 1 1 8 19.5z"/></svg>';
const wan=String(C.wa).replace(/\D/g,'');
const cta=`<div class="cta"><a class="ig" href="https://instagram.com/${C.ig}" target="_blank" rel="noopener">${IG}@${C.ig}</a>${wan?`<a class="wa" href="https://wa.me/${wan}?text=${encodeURIComponent('Hola, quiero consultar por mi equipo en reparación.')}" target="_blank" rel="noopener">${WA}WhatsApp</a>`:''}</div>`;

$('#root').innerHTML=`
<div id="v-c" class="wrap"><div class="c">
 <div class="hero"><img src="${LOGO}" alt="${C.nombre}"><h1>${C.nombre}</h1><p>Servicio técnico · Reparación de computadoras · Activación e instalación</p>${cta}</div>
 <div class="card"><h2>Consultá el estado de tu equipo</h2>
  <label for="tel">Teléfono con el que lo ingresaste</label><input id="tel" type="tel" inputmode="tel" placeholder="Ej: 261 555 1234">
  <button class="btn" id="buscar" style="margin-top:14px">Ver estado</button></div>
 <div id="res"></div><div class="foot">${C.nombre} · @${C.ig}</div></div></div>
<div id="v-p" class="wrap" hidden></div><div id="modal" class="ov" hidden></div>`;

async function buscar(){
 const h=await hash($('#tel').value),o=$('#res');
 if(!h){o.innerHTML='<div class="msg">Ingresá un número de teléfono válido.</div>';return}
 const r=PUB.filter(p=>p.h===h);
 o.innerHTML=r.length?r.map(p=>`<div class="card"><div class="top"><strong>${esc(p.equipo)}</strong><span class="pill ${cls(p.estado)}">${esc(p.estado)}</span></div>
  <div class="bar"><i style="width:${pg(p.estado)}%"></i></div>
  <div class="meta">Ingreso: ${fecha(p.ingreso)} · Última actualización: ${fecha(p.actualizado)}</div>
  ${p.diagnostico?`<div class="msg"><b>Diagnóstico:</b> ${esc(p.diagnostico)}</div>`:''}
  <div class="msg"><b>Presupuesto:</b> ${p.presupuesto?money(p.presupuesto):'A definir'}</div>
  ${p.nota?`<div class="msg"><b>Novedades:</b> ${esc(p.nota)}</div>`:''}</div>`).join('')
  :'<div class="msg">No encontramos equipos con ese número. Revisá que sea el mismo que dejaste al ingresarlo.</div>';
}
$('#buscar').onclick=buscar;$('#tel').addEventListener('keydown',e=>{if(e.key==='Enter')buscar()});

function armar(){
 $('#v-p').innerHTML=`<div class="bar2"><img src="${LOGO}" alt=""><h1>${C.nombre} · Panel</h1><div class="sp"></div>
  <a class="btn g s" href="#consulta" style="text-decoration:none">Ver página del cliente</a>
  <button class="btn g s" id="exp">Exportar a Excel (CSV)</button><button class="btn s" id="nuevo">+ Nuevo ingreso</button></div>
 <div class="kpis" id="kp"></div><div class="card"><h2>Ingresos cobrados · últimos 6 meses</h2><div id="ch"></div></div>
 <div class="flt"><input id="q" placeholder="Buscar cliente, teléfono o equipo…">
  <select id="fe"><option value="">Todos los estados</option>${ESTADOS.map(e=>`<option>${e}</option>`).join('')}</select>
  <select id="fc"><option value="">Cobro: todos</option><option value="p">Con saldo pendiente</option><option value="c">Cobrados</option></select></div>
 <div class="tw"><table><thead><tr>${[['ingreso','Ingreso'],['nombre','Cliente'],['tel','Teléfono'],['equipo','Equipo'],['estado','Estado'],['presupuesto','Presupuesto','n'],['cobrado','Cobrado','n'],['saldo','Saldo','n'],['ganancia','Ganancia','n']].map(c=>`<th data-k="${c[0]}" class="${c[2]||''}">${c[1]}</th>`).join('')}</tr></thead><tbody id="tb"></tbody><tfoot id="tf"></tfoot></table></div><div class="meta" id="st" style="margin-top:8px"></div>`;
 $('#q').oninput=e=>{F.q=e.target.value.toLowerCase();tabla()};$('#fe').onchange=e=>{F.e=e.target.value;tabla()};$('#fc').onchange=e=>{F.c=e.target.value;tabla()};
 $('#nuevo').onclick=()=>form(null);$('#exp').onclick=exportar;
 $('#v-p').querySelector('thead').onclick=e=>{const k=e.target.closest('th')?.dataset.k;if(!k)return;S=S.k===k?{k,d:-S.d}:{k,d:1};tabla()};
 $('#tb').onclick=e=>{if(e.target.closest('select'))return;const r=e.target.closest('tr');if(r)form(r.dataset.id)};
 $('#tb').onchange=async e=>{const s=e.target.closest('select');if(!s)return;const id=s.closest('tr').dataset.id;
  const it=items.find(i=>i.id===id),n={...it,estado:s.value,actualizado:Date.now()};
  try{await db.collection('equipos').doc(id).update({estado:n.estado,actualizado:n.actualizado})}catch(x){$('#st').textContent='No se pudo actualizar.';return}
  await pushPublic(items.map(i=>i.id===id?n:i))};
}
const calc=i=>({saldo:Math.max(num(i.presupuesto)-num(i.cobrado),0),ganancia:num(i.cobrado)>0?num(i.cobrado)-num(i.repuestos):0});
function kpis(){
 const m=new Date(),ym=d=>{const x=new Date(d);return x.getFullYear()*12+x.getMonth()},cur=m.getFullYear()*12+m.getMonth();
 const mes=items.filter(i=>num(i.cobrado)>0&&i.pagoFecha&&ym(i.pagoFecha)===cur);
 const cob=mes.reduce((a,i)=>a+num(i.cobrado),0),gan=mes.reduce((a,i)=>a+calc(i).ganancia,0);
 const por=items.filter(i=>i.estado!=='Cancelado').reduce((a,i)=>a+calc(i).saldo,0);
 const cur2=items.filter(i=>!['Entregado','Cancelado'].includes(i.estado)).length;
 $('#kp').innerHTML=`<div class="k"><span>Cobrado este mes</span><b>${money(cob)}</b></div><div class="k o"><span>Ganancia neta del mes</span><b>${money(gan)}</b></div>
  <div class="k w"><span>Por cobrar</span><b>${money(por)}</b></div><div class="k b"><span>Equipos en curso</span><b>${cur2}</b></div>`;
 const ms=[];for(let n=5;n>=0;n--){const d=new Date(m.getFullYear(),m.getMonth()-n,1);ms.push({k:d.getFullYear()*12+d.getMonth(),l:d.toLocaleDateString('es-AR',{month:'short'}),v:0})}
 items.forEach(i=>{if(num(i.cobrado)>0&&i.pagoFecha){const b=ms.find(x=>x.k===ym(i.pagoFecha));if(b)b.v+=num(i.cobrado)}});
 const mx=Math.max(...ms.map(x=>x.v),1),w=100/6;
 $('#ch').innerHTML=`<svg viewBox="0 0 600 190" width="100%" role="img" aria-label="Ingresos por mes">${ms.map((x,n)=>{const h=Math.round(x.v/mx*120),X=n*100+18;
  return `<rect x="${X}" y="${150-h}" width="64" height="${h}" rx="6" fill="${n===5?'#d71c1c':'#7a2020'}"><title>${money(x.v)}</title></rect>
  <text x="${X+32}" y="${142-h}" text-anchor="middle" font-size="12" fill="#fff">${x.v?(x.v>=1000?Math.round(x.v/1000)+'k':x.v):''}</text>
  <text x="${X+32}" y="172" text-anchor="middle" font-size="12" fill="#c4aeb1">${x.l}</text>`}).join('')}</svg>`;
}
function tabla(){
 let v=items.filter(i=>(!F.q||[i.nombre,i.tel,i.equipo].join(' ').toLowerCase().includes(F.q))&&(!F.e||i.estado===F.e)&&
  (!F.c||(F.c==='p'?calc(i).saldo>0&&i.estado!=='Cancelado':num(i.cobrado)>0&&calc(i).saldo===0)));
 const val=i=>S.k in calc(i)?calc(i)[S.k]:(['presupuesto','cobrado'].includes(S.k)?num(i[S.k]):String(i[S.k]??'').toLowerCase());
 v.sort((a,b)=>{const x=val(a),y=val(b);return (x>y?1:x<y?-1:0)*S.d});
 $('#tb').innerHTML=v.length?v.map(i=>{const c=calc(i);return `<tr class="r" data-id="${i.id}"><td>${fecha(i.ingreso)}</td><td>${esc(i.nombre)}</td><td>${esc(i.tel)}</td><td>${esc(i.equipo)}</td>
  <td><select>${ESTADOS.map(e=>`<option${e===i.estado?' selected':''}>${e}</option>`).join('')}</select></td>
  <td class="n">${money(i.presupuesto)}</td><td class="n">${money(i.cobrado)}</td><td class="n ${c.saldo?'neg':''}">${money(c.saldo)}</td><td class="n pos">${c.ganancia?money(c.ganancia):'—'}</td></tr>`}).join('')
  :'<tr><td colspan="9" class="meta" style="text-align:center;padding:24px">No hay equipos para mostrar.</td></tr>';
 const s=k=>v.reduce((a,i)=>a+(k==='presupuesto'||k==='cobrado'?num(i[k]):calc(i)[k]),0);
 $('#tf').innerHTML=`<tr><td colspan="5">${v.length} equipo${v.length===1?'':'s'}</td><td class="n">${money(s('presupuesto'))}</td><td class="n">${money(s('cobrado'))}</td><td class="n">${money(s('saldo'))}</td><td class="n">${money(s('ganancia'))}</td></tr>`;
}
function form(id){
 editing=id;delArm=false;const i=id?items.find(x=>x.id===id):{estado:'Ingresado',pago:'Efectivo'};
 const f=(k,l,t='text',x='')=>`<div><label>${l}</label><input id="f-${k}" type="${t}" value="${esc(i[k]??'')}" ${x}></div>`;
 $('#modal').innerHTML=`<div class="md"><h2 style="margin-bottom:6px">${id?'Editar equipo':'Nuevo ingreso'}</h2>
 <div class="g2">${f('nombre','Cliente')}${f('tel','Teléfono','tel')}${f('equipo','Equipo')}
 <div><label>Estado</label><select id="f-estado">${ESTADOS.map(e=>`<option${e===i.estado?' selected':''}>${e}</option>`).join('')}</select></div></div>
 <label>Diagnóstico</label><textarea id="f-diagnostico">${esc(i.diagnostico||'')}</textarea>
 <div class="g2">${f('presupuesto','Presupuesto ($)','number','min="0" step="any"')}${f('repuestos','Costo de repuestos ($)','number','min="0" step="any"')}${f('cobrado','Cobrado hasta hoy ($)','number','min="0" step="any"')}
 <div><label>Medio de pago</label><select id="f-pago">${PAGOS.map(e=>`<option${e===i.pago?' selected':''}>${e}</option>`).join('')}</select></div></div>
 ${f('nota','Novedades visibles para el cliente (opcional)')}
 <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap"><button class="btn" id="gu">Guardar</button><button class="btn g" id="ca">Cancelar</button>
 ${id?'<button class="btn g" id="de" style="margin-left:auto">Eliminar</button>':''}</div><div class="meta" id="fs" style="margin-top:8px"></div></div>`;
 $('#modal').hidden=false;$('#ca').onclick=()=>$('#modal').hidden=true;$('#gu').onclick=guardar;
 if(id)$('#de').onclick=async e=>{if(!delArm){delArm=true;e.target.textContent='¿Seguro? Tocá de nuevo';return}
  try{await db.collection('equipos').doc(id).delete()}catch(x){return}$('#modal').hidden=true;await pushPublic(items.filter(x=>x.id!==id))};
}
async function guardar(){
 const g=k=>$('#f-'+k).value.trim(),fs=$('#fs');
 if(!g('nombre')||!g('tel')||!g('equipo')){fs.textContent='Completá cliente, teléfono y equipo.';return}
 const h=await hash(g('tel'));if(!h){fs.textContent='Teléfono inválido.';return}
 const id=editing||crypto.randomUUID(),p=items.find(i=>i.id===id)||{},cob=num(g('cobrado'));
 const d={nombre:g('nombre'),tel:g('tel'),equipo:g('equipo'),estado:g('estado'),diagnostico:g('diagnostico'),presupuesto:g('presupuesto'),repuestos:g('repuestos'),cobrado:g('cobrado'),pago:g('pago'),nota:g('nota'),h,
  ingreso:p.ingreso||Date.now(),actualizado:Date.now(),pagoFecha:cob>0?(num(p.cobrado)===cob&&p.pagoFecha?p.pagoFecha:Date.now()):null};
 fs.textContent='Guardando…';
 try{await db.collection('equipos').doc(id).set(d)}catch(e){fs.textContent='No se pudo guardar: '+(e.message||e.code);return}
 await pushPublic(items.filter(i=>i.id!==id).concat({id,...d}));
}
async function exportar(){
 const dl=await claude.use('downloads');if(!dl){$('#st').textContent='La descarga no está disponible.';return}
 const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"',H=['Ingreso','Cliente','Teléfono','Equipo','Estado','Diagnóstico','Presupuesto','Repuestos','Cobrado','Saldo','Ganancia','Medio de pago'];
 const rows=items.map(i=>{const c=calc(i);return [fecha(i.ingreso),i.nombre,i.tel,i.equipo,i.estado,i.diagnostico,num(i.presupuesto),num(i.repuestos),num(i.cobrado),c.saldo,c.ganancia,i.pago].map(q).join(';')});
 try{await dl.save({filename:'tecnopc-mdz-equipos.csv',data:'\ufeff'+[H.map(q).join(';'),...rows].join('\r\n')})}catch(e){}
}
async function pushPublic(all){
 const art=await claude.use('artifact');if(!art)return;
 const pub=all.map(({h,equipo,estado,diagnostico,presupuesto,nota,ingreso,actualizado})=>({h,equipo,estado,diagnostico,presupuesto,nota,ingreso,actualizado}));
 const c=document.documentElement.cloneNode(true);c.querySelector('#root').innerHTML='';
 c.querySelector('#pub').textContent=JSON.stringify(pub).replace(/</g,'\\u003c');
 try{await art.publish('<!doctype html>\n'+c.outerHTML)}catch(e){}
}

function vista(){const p=admin&&location.hash!=='#consulta';$('#v-p').hidden=!p;$('#v-c').hidden=p;if(!p)$('#modal').hidden=true}
addEventListener('hashchange',vista);
(async()=>{try{
 const u=await claude.use('user');db=await claude.use('db');
 if(!db||!u||!u.canEdit())return;
 admin=true;armar();vista();
 db.collection('equipos').onSnapshot(s=>{items=s.docs.map(d=>({id:d.id,...d.data()}));kpis();tabla()},()=>{$('#st').textContent='Error al leer los datos.'});
}catch(e){}})();
</script>
